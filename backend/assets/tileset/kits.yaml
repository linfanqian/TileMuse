# Which catalog entries each theme uses. Edit this file by hand.
# Names must exist in catalog.yaml with `confidence: high`.
# A kit may use tiles from any pack.
# `description` tells the LLM when to choose the kit. A new kit here is enough for the spec
# and the prompts to offer it; then run `npm run gen:api`.
# Doors double as exits, so there is no `exit` tile.
# No pack has a lamp or torch, so `light` uses the closest match, alarm_beacon.

dungeon:
  description: stone interiors
  floor: sand_floor_a
  floor_shadow_top: sand_floor_shadow_top
  walls:
    top: stone_wall_top
    bottom: stone_wall_bottom
    left: stone_wall_left
    right: stone_wall_right
    corner_tl: stone_wall_corner_tl
    corner_tr: stone_wall_corner_tr
    corner_bl: stone_wall_corner_bl
    corner_br: stone_wall_corner_br
  doors:
    top: wooden_door_closed
    bottom: stone_opening_bottom
    left: stone_opening_left
    right: stone_opening_right
  objects:
    player_spawn: adventurer_a
    chest: chest_closed
    guard: knight_visor
    cover: wooden_barrel
    key: key
    light: alarm_beacon

