[project]
name = "tilemuse-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi[standard]>=0.143.0",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
