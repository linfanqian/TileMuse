name: CI

on:
  pull_request: # default types: opened, synchronize (every push), reopened
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its in-progress run, so only the latest commit counts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag; pin the release
      - name: Install dependencies
        run: uv sync --locked
      # Each check runs even if an earlier one failed, so one run reports every failure.
      - name: Lint (ruff)
        if: ${{ !cancelled() }}
        run: uv run ruff check --output-format=github .
      - name: Format check (ruff)
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .
      - name: Tests (pytest)
        if: ${{ !cancelled() }}
        run: uv run pytest

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Each check runs even if an earlier one failed, so one run reports every failure.
      - name: Lint (oxlint)
        if: ${{ !cancelled() }}
        run: npm run lint -- --format=github
      - name: Format check (prettier)
        if: ${{ !cancelled() }}
        run: npx prettier --check .
      - name: Typecheck (tsc)
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Tests (vitest)
        if: ${{ !cancelled() }}
        run: npm test
      - name: Build (vite)
        if: ${{ !cancelled() }}
        run: npm run build

  api-schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Start backend
        working-directory: backend
        run: |
          uv run fastapi run --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/openapi.json > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          echo "::error::Backend did not start within 30s"
          exit 1
      - name: Regenerate schema.d.ts
        working-directory: frontend
        run: npm run gen:api
      - name: Check schema.d.ts is up to date
        run: |
          git diff --exit-code -- frontend/src/api/schema.d.ts || {
            echo "::error file=frontend/src/api/schema.d.ts::schema.d.ts is stale. Run \`npm run gen:api\` in frontend/ with the backend running and commit the result."
            exit 1
          }

  ci-success:
    # The single required status check: passes only if every job above succeeded.
    # `always()` is required: a skipped required check counts as passing.
    if: always()
    needs: [backend, frontend, api-schema]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        env:
          RESULTS: backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} api-schema=${{ needs.api-schema.result }}
        run: |
          echo "$RESULTS"
          failed=0
          for r in $RESULTS; do
            if [ "${r#*=}" != success ]; then
              echo "::error::${r%%=*} did not succeed (${r#*=})"
              failed=1
            fi
          done
          exit "$failed"
